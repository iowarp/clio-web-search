[project]
name = "clio-web-search"
version = "0.2.0"
description = "Self-hosted web search and document understanding for AI agents"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "IOWarp" }]
dependencies = [
    "aiosqlite>=0.21.0,<1",
    "docling==2.119.0",
    "fastapi>=0.116.0,<1",
    "httpx>=0.28.1,<1",
    "lxml>=5.4.0,<7",
    "pydantic-settings>=2.10.0,<3",
    "python-multipart>=0.0.20,<1",
    "pyyaml>=6.0.2,<7",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "uvicorn[standard]>=0.35.0,<1",
]

[project.urls]
Homepage = "https://github.com/iowarp/clio-web-search"
Documentation = "https://github.com/iowarp/clio-web-search/tree/main/docs"
Issues = "https://github.com/iowarp/clio-web-search/issues"
Repository = "https://github.com/iowarp/clio-web-search"

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "lxml-stubs>=0.5.1,<1",
    "mypy>=1.17.0,<2",
    "pyright>=1.1.403,<2",
    "pytest>=8.4.0,<9",
    "pytest-asyncio>=1.1.0,<2",
    "ruff>=0.12.0,<1",
    "types-pyyaml>=6.0.12,<7",
]

[project.scripts]
clio-web-search = "clio_web_search.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clio_web_search"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "ICN", "PIE", "T20", "Q"]
ignore = ["S101", "S104", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["clio_web_search"]

[[tool.mypy.overrides]]
module = ["docling.*"]
ignore_missing_imports = true

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src"]
reportUnusedFunction = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--tb=short"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
